  - introduction_continued
  - verse_1
  - verse_1_2
  - verse_1_3
  - verse_1_4
  - verse_2
  - verse_2_2
  - verse_2_3
  - verse_2_4
  - verse_2_5
  - chorus_1
  - chorus_1_2
  - chorus_1_3
  - chorus_1_4
  - verse_3
  - verse_3_2
  - verse_3_3
  - verse_3_4
  - verse_3_5
  - chorus_1
  - chorus_2_2
  - chorus_1_3
  - chorus_2_4
  - verse_4
  - verse_4_2
  - verse_4_3
  - verse_4_4
  - coda_pickup
  - coda
  - coda_2
  - coda_repeat
  - coda_repeat_2
  - ending
