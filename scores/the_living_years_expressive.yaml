# Muse 2: reusable parts and musical form. Old phrase score retained alongside.
# Notes and phrase boundaries are preserved; omitted tracks are silent.
version: 2
name: The Living Years — expressive saxophone and electric piano
key: Ab
tempo: 96
meter: 4/4
volume: 6875
humanize: 0.18
swing: 0
reverb: 0.19

tracks:
  melody: {instrument: saxophone, playing: reflective-sax, level: 0.68, pan: -0.08}
  keys: {instrument: electric-piano, playing: warm-keys, level: 0.52, pan: 0.24}
  bass: {instrument: bass, playing: steady-bass, level: 0.56, pan: -0.12}
  kit: {instrument: drums, level: 1.0, pan: 0}

styles:
  reflective-sax:
    performance: {articulation: legato, swell: 0.12, vibrato: 0}
    notes: {accent: -0.3, vibrato: {depth: 0}}
    held: [{min_beats: 1.5, vibrato: {depth: 4, delay_ms: 280, rise_ms: 450, rate_hz: 5.1}}]
    shape: {start_db: -1.4, peak_db: 0.5, end_db: -2, peak_at: 0.58, tone: {start: -0.25, peak: 0, end: -0.3}}
    slur: true
    breath_ms: 65
  open-sax:
    extends: reflective-sax
    held: [{min_beats: 1.5, vibrato: {depth: 7, delay_ms: 280, rise_ms: 450, rate_hz: 5.1}}]
    shape: {peak_db: 1.2, tone: {peak: 0.18}}
  warm-keys:
    notes: {accent: -0.6}
  steady-bass:
    notes: {accent: -0.6}

marks:
  lean: {accent: 0.9}
  light: {accent: -1.8}
  ground: {accent: 0.4}

patterns:
  ab_intro: 1.5:a3-c4-e4@ground 1.5:a3-b3-e4 a3-c4-e4 |
  gm_intro: 4:g3-b3-d4n@ground |
  bbm_intro: 1.5:b3-d4-f4@ground 1.5:b3-c4-f4 b3-d4-f4 |
  ab_hold_high: 4:e4-a4-c5@ground |
  ab_verse_open: 0.5:e4-a4-c5@ground 0.25:c5@light 0.75:e4-a4-c5 0.25:b4@light 0.5:c4-e4-b4 1.75:c4-e4-a4 |
  ab_response: 3:c4-e4-a4@ground 0.5:z 0.5:a4 |
  db_verse_open: 0.5:d4-f4-c5@ground 0.25:c5@light 0.75:d4-f4-c5 0.25:b4@light 2.25:d4-f4-b4 |
  db_pickup: 3:d4-f4-b4@ground 0.75:z 0.25:f4@light |
  ab_verse_answer: 0.5:e4-a4-c5@ground 0.25:c5@light 0.5:e4-a4-c5 0.5:b4 0.5:c4-e4-b4 1.75:c4-e4-a4 |
  ab_pickup: 3:c4-e4-a4@ground 0.5:z 0.5:f4 |
  db_verse_answer: 0.5:d4-f4-c5@ground 0.25:c5@light 0.5:d4-f4-c5 0.5:b4 2.25:d4-f4-b4 |
  gb_verse: 0.5:g4b-b4-e5@ground 0.25:e5@light 0.5:g4b-b4-e5 0.5:d5 0.5:g4b-b4-d5 0.5:c5 0.25:c5@light 0.5:c5 0.5:d5 |
  gb_response: 0.5:g4b-b4-e5@ground 0.25:g4b-b4-e5@light 0.5:g4b-b4-e5 0.75:g4b-b4-d5 1.5:c5 0.25:z 0.25:b4@light |
  bbm_verse: 0.5:f4-b4-e5@ground 0.25:e5@light 0.5:f4-b4-e5 0.5:f4-b4-d5 0.5:f4-b4-d5 1.5:c5 0.25:c5@light |
  bbm_response: 0.5:f4-b4-e5@ground 0.5:e5 0.75:b4-d5-f5 0.25:d5@light d5 0.25:b4@light 0.5:b4 0.25:e4-a4-b4-d5@light |
  eb_sus: 0.25:e4-a4-b4-d5@light 0.5:d5 0.5:e4-a4-b4-d5 0.5:c5 0.75:e4-a4-c5 1.5:e4-a4-b4 |
  db_over_eb: f4-a4-d5@ground f4-a4-e5 0.75:e4-g4-c5 0.25:b4@light 0.75:a4 0.25:c4-e4-a4@light |
  ab_hold: 4:c4-e4-a4@ground |
  chorus_pickup: 2:c4-e4-a4@ground c4 d4 |
  ab_low_hold: 4:a3-c4-e4@ground |
  ab_low_answer: 2:a3-c4-e4@ground a3-c4-e4 a4 |
  db_low_hold: 4:a3-d4-f4@ground |
  db_low_answer: 2:a3-d4-f4@ground a3-d4-f4 a3-d4-f4 |
  eb_rise: 1.5:e4-g4-b4@ground 1.5:e4-g4-c5 d5 |
  eb_fall: 1.5:e4-g4-d5@ground 1.5:e4-g4-c5 b4 |
  ab_high_answer: 2:e4-a4-c5@ground c4 d4 |
  coda_pickup: 2:a3-d4-f4@ground c4 d4 |
  ab_bass_hold: 4:a2-e3@ground |
  gm_bass_hold: 4:g2-d3n@ground |
  bbm_bass_hold: 4:b2-f3@ground |
  eb_bass_hold: 4:e3-b3@ground |
  ab_octave_pulse: 1.75:a2-a3@ground 0.25:a2-a3@light 1.75:a2-a3 0.25:a2-a3@light |
  ab_bass_pulse: 1.75:a2-e3@ground 0.25:a2-e3@light 2:a2-e3 |
  db_bass_pulse: 1.75:d3-a3@ground 0.25:d3-a3@light 2:d3-a3 |
  gb_bass_pulse: 1.75:g2b-d3@ground 0.25:g2b-d3@light 2:g2b-d3 |
  bbm_bass_pulse: 1.75:b2-f3@ground 0.25:b2-f3@light 2:b2-f3 |
  eb_bass_pulse: 1.75:e3-b3@ground 0.25:e3-b3@light 2:e3-b3 |
  eb_half_notes: 2:e3-b3@ground 2:e3-b3 |
  ab_driving_bass: 1.75:a2-e3@ground 0.25:a2-e3@light 1.75:a2-e3 0.25:a2-e3@light |
  db_single_bass: 1.75:d3@ground 0.25:d3@light 2:d3 |
  db_driving_bass: 1.75:d3@ground 0.25:d3@light 1.75:d3 0.25:d3@light |
  chorus_entry: 0.5:kick-crash-hat 0.5:hat 0.5:snare-hat 0.5:hat 0.5:kick-hat 0.5:hat 0.5:snare-hat 0.5:hat |
  backbeat: 0.5:kick-hat 0.5:hat 0.5:snare-hat 0.5:hat 0.5:kick-hat 0.5:hat 0.5:snare-hat 0.5:hat |
  short_fill: 0.5:kick-hat 0.5:hat 0.5:snare-hat 0.5:hat 0.5:kick-hat 0.5:hat 0.25:snare 0.25:tom1 0.5:tom2 |
  verse_rim: 0.5:kick-hat 0.5:hat 0.5:rim-hat 0.5:hat 0.5:kick-hat 0.5:hat 0.5:rim-hat 0.5:hat |

sections:

  introduction:
    dynamic: p
    bars: 8
    parts:
      keys:
        - {use: ab_intro, repeat: 2}
        - {use: gm_intro, repeat: 2}
        - {use: bbm_intro, repeat: 2}
        - 1.5:e4-g4@ground 1.5:e4-a4 e4-b4 |
        - 1.5:e4-c5@ground 1.5:e4-d5 e4-e5 |
