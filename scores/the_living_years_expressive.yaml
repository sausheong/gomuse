  introduction_continued:
    dynamic: mp
    bars: 4
    parts:
      keys: {use: ab_hold_high, repeat: 4}
      bass:
        - {use: ab_octave_pulse, repeat: 3}
        - 1.75:a2-a3@ground 0.25:a2-a3@light 2:a2-a3 |

  verse_1:
    bars: 8
    parts:
      melody:
        - 0.5:c5@lean 0.25:c5@light 0.75:c5 0.25:b4@light 0.5:b4 1.75:a4 | a4@lean
        - 3:z |
        - 0.5:c5@lean 0.25:c5@light 0.75:c5 0.25:b4@light 2.25:b4 |
        - 3.75:z
        - 0.25:f4@light | 0.5:c5@lean 0.25:c5@light 0.5:c5 0.5:b4 0.5:b4 1.75:a4 | a4@lean
        - 2.5:z
        - 0.5:f4 | 0.5:c5@lean 0.25:c5@light 0.5:c5 0.5:b4 2.25:b4 |
        - 3.75:z
        - 0.25:f4@light |
      keys: {sequence: [ab_verse_open, ab_response, db_verse_open, db_pickup, ab_verse_answer, ab_pickup, db_verse_answer, db_pickup]}
      bass: {sequence: [{use: ab_bass_pulse, repeat: 2}, {use: db_bass_pulse, repeat: 2}, {use: ab_bass_pulse, repeat: 2}, {use: db_bass_pulse, repeat: 2}]}

  verse_1_2:
    bars: 6
    parts:
      melody:
        - 0.5:e5@lean 0.25:e5@light 0.5:e5 0.5:d5 0.5:d5 0.5:c5 0.25:c5@light 0.5:c5 0.5:d5 | 0.5:e5@lean 0.25:e5@light 0.5:e5 0.75:d5 c5
        - 0.75:z
        - 0.25:b4@light | 0.5:e5@lean 0.25:e5@light 0.5:e5 0.5:d5 0.5:d5 0.75:c5
        - 0.75:z
        - 0.25:c5@light | 0.5:e5@lean 0.5:e5 0.75:f5 0.25:d5@light d5 0.25:b4@light 0.5:b4 0.25:d5@light | 0.25:d5@light 0.5:d5 0.5:d5 0.5:c5 0.75:c5 0.5:b4
        - z |
        - d5@lean e5 0.75:c5 0.25:b4@light 0.75:a4 0.25:a4@light |
      keys: {sequence: [gb_verse, gb_response, bbm_verse, bbm_response, eb_sus, db_over_eb]}
      bass: {sequence: [{use: gb_bass_pulse, repeat: 2}, {use: bbm_bass_pulse, repeat: 2}, eb_bass_pulse, eb_half_notes]}

  verse_1_3:
    ritardando: 0.035
    bars: 1
    parts:
      melody:
        - 3:a4@lean
        - z |
      keys: {use: ab_hold}
      bass: {use: ab_driving_bass}

  verse_1_4:
    bars: 1
    parts:
      melody:
        - 3:z
        - c5@lean |
      keys: 3:c4-e4-a4@ground z |
      bass: {use: ab_bass_pulse}

  verse_2:
    extends: verse_1
    parts:
      melody:
        - 0.5:c5@lean 0.25:c5@light 0.75:c5 0.25:b4@light 0.5:b4 1.75:a4 | a4@lean
        - 2.5:z
        - 0.5:a4 | 0.5:c5@lean 0.25:c5@light 0.75:c5 0.25:b4@light 2.25:b4 |
        - 3.75:z
        - 0.25:f4@light | 0.5:c5@lean 0.25:c5@light 0.5:c5 0.5:b4 0.5:b4 1.75:a4 | a4@lean
        - 2:z
        - 0.5:b4 0.5:d5 | 0.5:c5@lean 0.25:c5@light 0.5:c5 0.5:b4 2.25:b4 |
        - 3.75:z
        - 0.25:f4@light |

  verse_2_2:
    bars: 5
    parts:
      melody:
        - 0.5:e5@lean 0.25:e5@light 0.5:e5 0.5:d5 0.5:d5 0.5:c5 0.25:c5@light 0.5:c5 0.5:d5 | 0.5:e5@lean 0.25:e5@light 0.5:e5 0.75:d5 c5
        - 0.75:z
        - 0.25:b4@light | 0.5:e5@lean 0.25:e5@light 0.5:e5 0.5:d5 0.5:d5 0.75:c5
        - 0.75:z
        - 0.25:c5@light | 0.5:e5@lean 0.5:e5 0.75:f5 0.25:d5@light d5 0.25:b4@light 0.5:b4 0.25:d5@light | 0.25:d5@light 0.5:d5 0.5:d5 0.5:c5 0.75:c5 0.5:b4
        - z |
      keys: {sequence: [gb_verse, gb_response, bbm_verse, bbm_response, eb_sus]}
      bass: {sequence: [{use: gb_bass_pulse, repeat: 2}, {use: bbm_bass_pulse, repeat: 2}, eb_bass_pulse]}

  verse_2_3:
    hairpin: cresc
    bars: 1
    parts:
      melody: d5@lean e5 0.75:c5 0.25:b4@light 0.75:a4 0.25:a4@light |
      keys: {use: db_over_eb}
      bass: {use: eb_half_notes}

  verse_2_4:
    extends: verse_1_3
    hairpin: cresc

  verse_2_5:
    dynamic: mf
    bars: 1
    parts:
      melody:
        - 2:z
        - c4@lean d4 |
      keys: {use: chorus_pickup}
      bass: {use: ab_bass_pulse}

  chorus_1:
    bars: 8
    playing: {melody: open-sax}
    parts:
      melody:
        - 4:e4@lean | e4@lean
        - z
        - e4 a4 | 4:f4@lean | f4@lean
        - z
        - f4 f4 | 1.5:b4@lean 1.5:c5 d5 | 1.5:d5@lean 1.5:c5 b4 | 4:c5@lean | c5@lean
        - z
        - c4 d4 |
      keys: {sequence: [ab_low_hold, ab_low_answer, db_low_hold, db_low_answer, eb_rise, eb_fall, ab_hold_high, ab_high_answer]}
      bass: {sequence: [{use: ab_bass_pulse, repeat: 2}, {use: db_single_bass, repeat: 2}, {use: eb_bass_pulse, repeat: 2}, ab_driving_bass, ab_bass_pulse]}
