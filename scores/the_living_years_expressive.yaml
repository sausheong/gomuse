  chorus_1_2:
    bars: 6
    playing: {melody: open-sax}
    parts:
      melody:
        - 4:e4@lean | e4@lean
        - z
        - e4 a4 | 4:f4@lean | f4@lean
        - z
        - f4 f4 | 1.5:b4@lean 1.5:c5 d5 | 1.5:d5@lean 1.5:c5 b4 |
      keys: {sequence: [ab_low_hold, ab_low_answer, db_low_hold, db_low_answer, eb_rise, eb_fall]}
      bass: {sequence: [{use: ab_bass_pulse, repeat: 2}, {use: db_single_bass, repeat: 2}, {use: eb_bass_pulse, repeat: 2}]}
      kit: {use: backbeat, repeat: 6}

  chorus_1_3:
    ritardando: 0.035
    bars: 1
    playing: {melody: open-sax}
    parts:
      melody: 4:a4@lean |
      keys: {use: ab_hold}
      bass: {use: ab_driving_bass}
      kit: {use: short_fill}

  chorus_1_4:
    bars: 1
    playing: {melody: open-sax}
    parts:
      melody: 3:a4@lean 0.5:c5 0.5:c5 |
      keys: 3:c4-e4-a4@ground 0.5:c5 0.5:c5 |
      bass: {use: ab_bass_pulse}
      kit: {use: backbeat}

  verse_3:
    extends: verse_1
    dynamic: mp
    parts:
      kit: {use: verse_rim, repeat: 8}

  verse_3_2:
    extends: verse_2_2
    parts:
      kit: {use: verse_rim, repeat: 5}

  verse_3_3:
    extends: verse_2_3
    parts:
      kit: {use: verse_rim}

  verse_3_4:
    extends: verse_1_3
    hairpin: cresc
    parts:
      kit: {use: verse_rim}

  verse_3_5:
    extends: verse_2_5
    parts:
      kit: {use: verse_rim}

  chorus_2_2:
    extends: chorus_1_2
    dynamic: f

  chorus_2_4:
    bars: 1
    playing: {melody: open-sax}
    parts:
      melody:
        - 3:a4@lean
        - 0.5:z
        - 0.5:c5 |
      keys: {use: ab_hold}
      bass: {use: ab_bass_pulse}
      kit: {use: backbeat}

  verse_4:
    extends: verse_1
    dynamic: p
    parts:
      kit: {use: verse_rim, repeat: 8}

  verse_4_2:
    extends: verse_2_2
    dynamic: mp
    parts:
      kit: {use: verse_rim, repeat: 5}

  verse_4_3:
    extends: verse_2_3
    ritardando: 0.035
    parts:
      kit: {use: verse_rim}

  verse_4_4:
    hairpin: cresc
    bars: 1
    parts:
      melody:
        - 3:a4@lean
        - z |
      keys: {use: ab_hold}
      bass: {use: ab_driving_bass}
      kit: {use: verse_rim}

  coda_pickup:
    extends: verse_2_5
    parts:
      kit: {use: backbeat}

  coda:
    bars: 3
    parts:
      melody:
        - 4:e4@lean | e4@lean
        - z
        - e4 a4 | 4:f4@lean |
      keys: {sequence: [ab_low_hold, ab_low_answer, db_low_hold]}
      bass: {sequence: [ab_driving_bass, ab_bass_pulse, db_driving_bass]}
      kit: {sequence: [chorus_entry, {use: backbeat, repeat: 2}]}

  coda_2:
    hairpin: dim
    bars: 1
    parts:
      melody:
        - f4@lean
        - z
        - c4 d4 |
      keys: {use: coda_pickup}
      bass: {use: db_single_bass}
      kit: {use: short_fill}

  coda_repeat:
    extends: coda
    dynamic: mp

  coda_repeat_2:
    extends: coda_2
    ritardando: 0.12

  ending:
    dynamic: p
    ritardando: 0.2
    fermata: 3
    bars: 1
    parts:
      melody: {notes: '4:e4@lean |', breath_ms: 0}
      keys: {use: ab_low_hold}
      bass: {use: ab_bass_hold}
      kit: kick-crash 3:z |

form:
