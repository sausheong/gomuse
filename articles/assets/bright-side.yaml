# Bright Side - an original bright, jazzy pop song, about a minute long.
# F major, 4/4, 120 bpm with a light swing; one section per bar.
# Form: intro (sax hook) | verse | chorus | sax solo | last chorus | ending.
# Muse has three pitched channels plus drums, so the band shares them:
#   C1 lead:   voice in the verses and choruses, saxophone in the intro and solo
#   C2 chords: piano, handing over to guitar in the choruses
#   C3 bass:   bass guitar throughout
#   drums:     a rim-click groove in the intro, hi-hats in the verses, open
#              hats in the choruses, the ride under the solo, tom fills
#              into each new part
